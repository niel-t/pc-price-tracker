name: Check prices

on:
  schedule:
    - cron: "17 * * * *"   # hourly (GitHub may delay scheduled runs by some minutes)
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]
    paths: [products.json]  # check right away when you add or edit parts

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest -q tests

      - name: Check prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check.py

      - name: Commit updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update prices $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
