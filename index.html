<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Price Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #667085; --border: #e4e7ec;
    --accent: #2563eb; --good: #15803d; --good-bg: #dcfce7; --bad: #b42318; --bad-bg: #fee4e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e6e8eb; --muted: #98a2b3; --border: #2a2f3a;
      --accent: #5b8def; --good: #4ade80; --good-bg: #13301e; --bad: #f97066; --bad-bg: #3a1714;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 22px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .btn { display: inline-block; background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 7px 12px; color: var(--text); text-decoration: none; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.cat td { background: var(--bg); font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  tr.item { cursor: pointer; }
  tr.item:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .down { color: var(--good); background: var(--good-bg); }
  .up { color: var(--bad); background: var(--bad-bg); }
  .hit { color: var(--good); }
  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); padding: 20px; width: min(760px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .alert { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .alert pre { margin: 4px 0 0; font: inherit; white-space: pre-wrap; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  @media (max-width: 700px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>PC Price Tracker</h1>
      <div class="muted" id="status">Loading…</div>
    </div>
    <div class="row">
      <a class="btn" id="editLink" target="_blank" rel="noopener">Edit parts</a>
      <a class="btn" id="runLink" target="_blank" rel="noopener">Check now</a>
    </div>
  </header>

  <div class="card stats">
    <div class="stat"><div class="v" id="buildTotal">–</div><div class="l">Build total (cheapest per part)</div></div>
    <div class="stat"><div class="v" id="partCount">0</div><div class="l">Components tracked</div></div>
    <div class="stat"><div class="v" id="hitCount">0</div><div class="l">At or below target</div></div>
  </div>

  <div class="card" style="padding:0; overflow-x:auto">
    <table>
      <thead><tr>
        <th>Component</th>
        <th class="num">Lowest</th>
        <th class="hide-sm">Shop</th>
        <th class="num">Change</th>
        <th class="num hide-sm">All-time low</th>
        <th class="num">Target</th>
      </tr></thead>
      <tbody id="products"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Recent alerts</h2>
    <div id="alerts" class="muted">No alerts yet.</div>
  </div>
</main>

<dialog id="detail">
  <div class="row" style="justify-content:space-between; margin-bottom:12px">
    <h2 id="detailTitle" style="margin:0"></h2>
    <button class="btn" onclick="detail.close()">Close</button>
  </div>
  <div style="height:260px"><canvas id="chart"></canvas></div>
  <h2 style="margin-top:16px">Current offers</h2>
  <div style="max-height:260px; overflow:auto">
    <table><thead><tr><th>Shop</th><th class="num">Price</th><th class="num">Incl. shipping</th></tr></thead><tbody id="offers"></tbody></table>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (v) => v == null ? "–" : new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" }).format(v);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pidOf = (url) => (url.match(/pricewatch\/(\d+)\//) || [])[1];
function ago(iso) {
  if (!iso) return "never";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
}
const load = (path, fallback) => fetch(`${path}?t=${Date.now()}`, { cache: "no-store" }).then((r) => r.ok ? r.json() : fallback).catch(() => fallback);

// https://<owner>.github.io/<repo>/ -> GitHub links for editing parts and running the check
const owner = location.hostname.split(".")[0];
const repo = location.pathname.split("/").filter(Boolean)[0] || "pc-price-tracker";
const gh = `https://github.com/${owner}/${repo}`;
$("editLink").href = `${gh}/edit/main/products.json`;
$("runLink").href = `${gh}/actions/workflows/check-prices.yml`;

let latest = {}, history = {}, chart;

async function render() {
  const [config, l, h, alerts] = await Promise.all([
    load("products.json", { products: [] }), load("data/latest.json", {}), load("data/history.json", {}), load("data/alerts.json", []),
  ]);
  latest = l; history = h;
  const order = ["CPU", "GPU", "Motherboard", "RAM", "Storage", "PSU", "Case", "Cooler", "Monitor", "Other"];
  const items = config.products.map((p) => {
    const id = pidOf(p.url), cur = latest[id], pts = history[id] || [];
    const lowest = cur?.offers?.[0]?.price ?? null;
    return { ...p, id, cur, lowest, shop: cur?.offers?.[0]?.shop,
             prev: pts.length > 1 ? pts[pts.length - 2][1] : null,
             atl: pts.length ? Math.min(...pts.map((x) => x[1])) : null };
  }).sort((a, b) => (order.indexOf(a.category) + 99) % 99 - (order.indexOf(b.category) + 99) % 99 || a.name.localeCompare(b.name));

  let html = "", cat = null;
  for (const p of items) {
    if (p.category !== cat) { cat = p.category; html += `<tr class="cat"><td colspan="6">${esc(cat || "Other")}</td></tr>`; }
    let change = "";
    if (p.lowest != null && p.prev != null) {
      const pct = ((p.lowest - p.prev) / p.prev) * 100;
      change = `<span class="pill ${pct < 0 ? "down" : "up"}" title="vs ${fmt(p.prev)}">${pct > 0 ? "+" : ""}${pct.toFixed(1)}%</span>`;
    }
    const hit = p.target_price != null && p.lowest != null && p.lowest <= p.target_price;
    html += `<tr class="item" data-id="${p.id}">
      <td class="name"><a href="${esc(p.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(p.cur?.name || p.name)}</a>
        <div class="muted" style="font-size:12px">${p.cur ? `${p.cur.offers.length} shops · checked ${ago(p.cur.checked_at)}` : "not checked yet"}</div></td>
      <td class="num ${hit ? "hit" : ""}"><b>${fmt(p.lowest)}</b></td>
      <td class="hide-sm">${esc(p.shop ?? "–")}</td>
      <td class="num">${change}</td>
      <td class="num hide-sm">${fmt(p.atl)}</td>
      <td class="num ${hit ? "hit" : "muted"}">${fmt(p.target_price)}</td>
    </tr>`;
  }
  $("products").innerHTML = html || `<tr><td colspan="6" class="empty">No components yet. Click “Edit parts” to add Tweakers URLs to products.json.</td></tr>`;

  const priced = items.filter((p) => p.lowest != null);
  $("buildTotal").textContent = priced.length ? fmt(priced.reduce((s, p) => s + p.lowest, 0)) : "–";
  $("partCount").textContent = items.length;
  $("hitCount").textContent = items.filter((p) => p.target_price != null && p.lowest != null && p.lowest <= p.target_price).length;

  const lastCheck = Object.values(latest).map((x) => x.checked_at).sort().pop();
  $("status").textContent = `Prices from Tweakers Pricewatch · last check ${ago(lastCheck)}`;
  $("alerts").innerHTML = alerts.length
    ? alerts.slice(0, 30).map((a) => `<div class="alert"><b><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a></b> <span class="muted">· ${ago(a.time)}</span><pre>${esc(a.message)}</pre></div>`).join("")
    : "No alerts yet.";
}

function openDetail(id) {
  const cur = latest[id], pts = history[id] || [];
  if (!cur) return;
  $("detailTitle").textContent = cur.name;
  $("offers").innerHTML = cur.offers.map((o) => `<tr><td>${esc(o.shop)}</td><td class="num">${fmt(o.price)}</td><td class="num">${fmt(o.total)}</td></tr>`).join("");
  // History only stores changes; extend the last price to the latest check so the line reaches "now".
  const series = [...pts.map((p) => ({ t: p[0], v: p[1], shop: p[2] }))];
  if (series.length && cur.checked_at > series[series.length - 1].t) series.push({ ...series[series.length - 1], t: cur.checked_at });
  const css = getComputedStyle(document.documentElement);
  if (chart) chart.destroy();
  chart = new Chart($("chart"), {
    type: "line",
    data: {
      labels: series.map((s) => new Date(s.t).toLocaleString("nl-NL", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })),
      datasets: [{ data: series.map((s) => s.v), borderColor: css.getPropertyValue("--accent"), stepped: true, pointRadius: 2, fill: false }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${fmt(c.parsed.y)} at ${series[c.dataIndex].shop}` } } },
      scales: { y: { ticks: { callback: (v) => fmt(v), color: css.getPropertyValue("--muted") }, grid: { color: css.getPropertyValue("--border") } },
                x: { ticks: { maxTicksLimit: 8, color: css.getPropertyValue("--muted") }, grid: { display: false } } },
    },
  });
  $("detail").showModal();
}

$("products").addEventListener("click", (e) => { const row = e.target.closest("tr.item"); if (row) openDetail(row.dataset.id); });
render();
setInterval(render, 5 * 60000);
</script>
</body>
</html>
